name: Supabase keepalive

# Supabase free-tier projects pause after ~7 days with no activity, and a
# paused database would break the live demo. This pings the REST API on a
# schedule so the project never goes idle. Also runnable on demand from
# the Actions tab right before a demo.
on:
  schedule:
    # Every 3 days at 06:00 UTC — comfortably inside the ~7 day window.
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are not set."
            exit 1
          fi

          # RLS scopes departments to authenticated users, so an anon read
          # returns 200 with an empty array — that's fine here. PostgREST
          # still executes the query, which is what keeps the project from
          # going idle; we only assert on the status code.
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/departments?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP $status"
          cat /tmp/body.txt

          if [ "$status" != "200" ]; then
            echo "::error::Supabase ping failed with HTTP $status — the project may be paused."
            exit 1
          fi
          echo "Supabase project is awake."
